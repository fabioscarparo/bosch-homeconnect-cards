name: New appliance card
description: Help build a card for an appliance that doesn't have one yet
labels: ["new appliance"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! The [Contributing](https://github.com/fabioscarparo/bosch-homeconnect-cards#contributing) section explains how to collect the files.

        **Never attach the ZIP file of the Home Connect Profile Downloader**: it contains the encryption keys of your appliances.
  - type: input
    id: appliance
    attributes:
      label: Appliance
      description: Type, brand and model
      placeholder: Washer-dryer, Bosch WNA254U0IT
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - Home Connect Local by chris-mc1
        - Home Connect Local fork by vemboy200
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "1.9.0"
  - type: textarea
    id: files
    attributes:
      label: Diagnostics and entity exports
      description: Drag the files here. One entity export for each moment you captured, for example off, ready, running and finished.
    validations:
      required: true
  - type: textarea
    id: wishes
    attributes:
      label: What would you like to see and do from the card?
      description: The information you check most and the controls you use every day. Screenshots of the official Home Connect app are welcome.
